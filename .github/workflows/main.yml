name: Actualización de Ranking de Fondos Mutuos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actualizar-ranking-fondos
  cancel-in-progress: false

jobs:
  ejecutar-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      BUSCAFONDOS_API_KEY: ${{ secrets.BUSCAFONDOS_API_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      TZ: America/Santiago

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv

      - name: Ejecutar script de Ranking de Administradoras
        run: |
          python Ranking_Adminisrtadoras.py
